[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "service-agent"
version = "0.1.0"
description = "Execution governance and RL post-training for enterprise LLM agents on tau2-bench telecom"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "tau2[gym]",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-xdist>=3.5.0",
    "ruff>=0.9.1",
]

[tool.uv.sources]
tau2 = { path = "third_party/tau2-bench", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/service_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:litellm.*:",
    "ignore:Pydantic serializer warnings:UserWarning:pydantic.*:",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
