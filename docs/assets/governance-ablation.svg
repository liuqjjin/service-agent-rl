<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">冻结开发集治理消融结果</title>
  <desc id="desc">对比 H0、H1、H2 的平均奖励、pass 四次全通过率、未授权写操作和最大步数失败。H2 在零未授权写操作的安全门槛下获得最高奖励，因此被选为 Hbest。</desc>
  <defs>
    <style>
      text { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .head { font-size: 22px; font-weight: 700; }
      .metric { font-size: 14px; fill: #475569; }
      .value { font-size: 30px; font-weight: 700; }
      .small { font-size: 13px; fill: #64748b; }
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fafc"/>
  <text x="48" y="50" class="title">冻结开发集治理消融：任务成功与执行安全</text>
  <text x="48" y="78" class="subtitle">20 个任务 × 每个实验臂 4 次运行；三个实验臂使用相同任务与 trial seed</text>

  <g transform="translate(48 112)">
    <rect width="336" height="414" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect width="336" height="62" rx="20" fill="#e2e8f0"/>
    <rect y="42" width="336" height="20" fill="#e2e8f0"/>
    <text x="24" y="39" class="head">H0｜原生执行</text>
    <text x="24" y="100" class="metric">平均奖励</text>
    <text x="312" y="106" text-anchor="end" class="value">0.912</text>
    <rect x="24" y="124" width="288" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="24" y="124" width="263" height="14" rx="7" fill="#64748b"/>
    <line x1="24" y1="174" x2="312" y2="174" stroke="#e2e8f0"/>
    <text x="24" y="208" class="metric">pass⁴</text>
    <text x="312" y="213" text-anchor="end" class="value">0.850</text>
    <line x1="24" y1="248" x2="312" y2="248" stroke="#e2e8f0"/>
    <text x="24" y="284" class="metric">已执行的未授权写操作</text>
    <text x="312" y="293" text-anchor="end" class="value" fill="#dc2626">36</text>
    <text x="24" y="320" class="small">其中 34 次所在 episode 仍获得满分</text>
    <line x1="24" y1="344" x2="312" y2="344" stroke="#e2e8f0"/>
    <text x="24" y="381" class="metric">最大步数失败</text>
    <text x="312" y="389" text-anchor="end" class="value">7</text>
  </g>

  <g transform="translate(432 112)">
    <rect width="336" height="414" rx="20" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect width="336" height="62" rx="20" fill="#fef3c7"/>
    <rect y="42" width="336" height="20" fill="#fef3c7"/>
    <text x="24" y="39" class="head">H1｜前置条件门控</text>
    <text x="24" y="100" class="metric">平均奖励</text>
    <text x="312" y="106" text-anchor="end" class="value">0.850</text>
    <rect x="24" y="124" width="288" height="14" rx="7" fill="#fde68a"/>
    <rect x="24" y="124" width="245" height="14" rx="7" fill="#f59e0b"/>
    <line x1="24" y1="174" x2="312" y2="174" stroke="#e2e8f0"/>
    <text x="24" y="208" class="metric">pass⁴</text>
    <text x="312" y="213" text-anchor="end" class="value">0.750</text>
    <line x1="24" y1="248" x2="312" y2="248" stroke="#e2e8f0"/>
    <text x="24" y="284" class="metric">已执行的未授权写操作</text>
    <text x="312" y="293" text-anchor="end" class="value" fill="#059669">0</text>
    <text x="24" y="320" class="small">强制合规路径，但更容易达到步数上限</text>
    <line x1="24" y1="344" x2="312" y2="344" stroke="#e2e8f0"/>
    <text x="24" y="381" class="metric">最大步数失败</text>
    <text x="312" y="389" text-anchor="end" class="value">12</text>
  </g>

  <g transform="translate(816 112)">
    <rect width="336" height="414" rx="20" fill="#ffffff" stroke="#059669" stroke-width="3"/>
    <rect width="336" height="62" rx="20" fill="#d1fae5"/>
    <rect y="42" width="336" height="20" fill="#d1fae5"/>
    <text x="24" y="39" class="head">H2｜门控 + 幂等 + 恢复</text>
    <text x="24" y="100" class="metric">平均奖励</text>
    <text x="312" y="106" text-anchor="end" class="value">0.900</text>
    <rect x="24" y="124" width="288" height="14" rx="7" fill="#a7f3d0"/>
    <rect x="24" y="124" width="259" height="14" rx="7" fill="#059669"/>
    <line x1="24" y1="174" x2="312" y2="174" stroke="#e2e8f0"/>
    <text x="24" y="208" class="metric">pass⁴</text>
    <text x="312" y="213" text-anchor="end" class="value">0.850</text>
    <line x1="24" y1="248" x2="312" y2="248" stroke="#e2e8f0"/>
    <text x="24" y="284" class="metric">已执行的未授权写操作</text>
    <text x="312" y="293" text-anchor="end" class="value" fill="#059669">0</text>
    <text x="24" y="320" class="small">满足安全门槛，且安全实验臂中奖励最高</text>
    <line x1="24" y1="344" x2="312" y2="344" stroke="#e2e8f0"/>
    <text x="24" y="381" class="metric">最大步数失败</text>
    <text x="312" y="389" text-anchor="end" class="value">8</text>
  </g>

  <rect x="48" y="552" width="1104" height="42" rx="14" fill="#ecfdf5" stroke="#059669"/>
  <text x="600" y="578" text-anchor="middle" class="metric" fill="#047857">选择规则：先满足 0 次未授权写操作，再选择平均奖励最高的安全实验臂 → Hbest = H2</text>
</svg>
